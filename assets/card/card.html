<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1280, initial-scale=1">
  <title>Grid Defender · Arcade card</title>
  <!--
    Source for assets/images/card.webp (the Arcade card image, 16:9).
    Renders the real Level 3 board with the game's own ui/board.js and data/levels.json.
    Regenerate from the repo root with the server running (python3 -m http.server 8000 --bind 127.0.0.1):
      "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
        --window-size=1280,720 --force-device-scale-factor=1.5 --virtual-time-budget=4000 \
        --screenshot=card.png http://127.0.0.1:8000/assets/card/card.html
      cwebp -q 86 card.png -o assets/images/card.webp
  -->
  <link rel="stylesheet" href="../../style.css">
  <style>
    :root { --cell: 64px; }
    html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; }
    body {
      background: radial-gradient(1100px 650px at 85% 35%, #1a2a40 0%, #0b1017 62%), #0b1017;
      color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: grid; grid-template-columns: 520px 1fr; align-items: center; padding: 0 56px; box-sizing: border-box;
      border-top: 6px solid var(--accent);
    }
    .kicker { color: var(--accent); font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; font-size: 17px; margin: 0 0 14px; display: flex; gap: 8px; align-items: center; }
    h1 { font-size: 84px; line-height: 1; margin: 0 0 18px; letter-spacing: -0.02em; }
    h1 .bolt { color: var(--accent); }
    .tagline { font-size: 27px; line-height: 1.3; margin: 0 0 26px; max-width: 470px; }
    .chips { display: flex; flex-wrap: wrap; gap: 10px; margin: 0 0 28px; padding: 0; list-style: none; }
    .chips li { border: 1px solid var(--border); background: #ffffff0d; border-radius: 999px; padding: 6px 14px; font-size: 18px; color: var(--muted); }
    .rule { display: flex; flex-direction: column; gap: 8px; max-width: 470px; }
    .rule-line { display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; background: var(--surface-2); border: 1px solid var(--border);
      border-left: 5px solid var(--ok); border-radius: 8px; padding: 9px 12px; font-size: 16px; white-space: nowrap; }
    .rule-line.blocked { border-left-color: var(--bad); color: var(--muted); }
    .tag { font-weight: 800; font-size: 12px; letter-spacing: 0.06em; padding: 2px 7px; border-radius: 4px; }
    .tag.permit { background: var(--ok-bg); color: var(--ok); }
    .tag.deny { background: var(--bad-bg); color: var(--bad); }
    .arrow { color: var(--accent); font-weight: 800; }
    .rule-line .fc-tag { font-size: 13px; }
    .stage { position: relative; justify-self: center; }
    .stage .legend, .stage .board-details { display: none; }
    .stage .board { gap: 3px; grid-template-columns: 26px repeat(8, var(--cell)); grid-auto-rows: var(--cell); margin: 0; }
    .stage .board .label { font-size: 16px; }
    .stage .board .cell { border-radius: 7px; }
    .stage .cell .piece-icon { width: 30px; height: 30px; }
    .stage .cell .glyph { font-size: 14px; }
    .stage .zone-plate { font-size: 11px; padding: 2px 7px; }
    .stage .cell.conduit { border-width: 3px; box-shadow: 0 0 22px #b18cff88; }
    svg.paths { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; z-index: 1; }
    .stage .cell .piece { position: relative; z-index: 2; background: inherit; border-radius: 6px; padding: 2px 4px; }
    .stage .cell.has-asset, .stage .cell.conduit { z-index: 2; }
    .badge-dot { position: absolute; z-index: 3; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
      font-weight: 800; font-size: 20px; transform: translate(-50%, -50%); box-shadow: 0 0 0 3px #0b1017; }
    .badge-dot.ok { background: var(--ok); color: #04140a; }
    .badge-dot.bad { background: var(--bad); color: #fff; }
  </style>
</head>
<body>
  <section>
    <p class="kicker">IEC 62443 · DNP3 · SCADA</p>
    <h1><span class="bolt">⚡</span> Grid Defender</h1>
    <p class="tagline">Write the conduit rules that keep a substation's breakers in the right hands.</p>
    <ul class="chips">
      <li>Zones &amp; conduits</li><li>DNP3 function codes</li><li>Least privilege</li><li>6 rounds</li>
    </ul>
    <div class="rule">
      <div class="rule-line"><span class="tag permit">PERMIT</span> M <span class="arrow">→</span> R1 · DNP3
        <span class="fc-tag">READ</span><span class="fc-tag">SELECT</span><span class="fc-tag">OPERATE</span></div>
      <div class="rule-line blocked"><span class="tag deny">DENIED</span> V <span class="arrow">→</span> R2 · vendor laptop, stopped at conduit 1</div>
    </div>
  </section>
  <div class="stage" id="stage"></div>

  <script type="module">
    import { renderBoard } from '../../ui/board.js';
    const doc = await (await fetch('../../data/levels.json')).json();
    const level = doc.levels.find(l => l.id === 'L3');
    const board = doc.boards.find(b => b.id === level.boardId);
    const stage = document.getElementById('stage');
    stage.append(renderBoard(board, board.assets.map(a => a.id), level.sltOverrides || {}));
    const grid = stage.querySelector('.board');
    grid.removeAttribute('aria-hidden');

    const center = cell => {
      const n = grid.querySelector(`[data-cell="${cell}"]`);
      return { x: n.offsetLeft + n.offsetWidth / 2, y: n.offsetTop + n.offsetHeight / 2 };
    };
    const cellOf = id => board.assets.find(a => a.id === id).cell;
    const conduit = id => board.conduits.find(c => c.id === id).cell;

    const svgNS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(svgNS, 'svg');
    svg.setAttribute('class', 'paths');
    svg.setAttribute('width', grid.offsetWidth);
    svg.setAttribute('height', grid.offsetHeight);
    const line = (cells, color, dash) => {
      const p = document.createElementNS(svgNS, 'polyline');
      p.setAttribute('points', cells.map(c => { const o = center(c); return `${o.x},${o.y}`; }).join(' '));
      p.setAttribute('fill', 'none');
      p.setAttribute('stroke', color);
      p.setAttribute('stroke-width', '5');
      p.setAttribute('stroke-linecap', 'round');
      p.setAttribute('stroke-linejoin', 'round');
      if (dash) p.setAttribute('stroke-dasharray', dash);
      svg.append(p);
    };
    // Allowed: Engineering reads R2 across both conduits (round 3.2). Blocked: the vendor laptop stops at conduit 1.
    line([cellOf('E'), conduit('1'), conduit('2'), cellOf('R2')], '#3fcf6a', '2 12');
    line([cellOf('V'), conduit('1')], '#ff5a4f', '2 12');
    grid.append(svg);

    const dotAt = (x, y, cls, text) => {
      const d = document.createElement('span');
      d.className = `badge-dot ${cls}`;
      d.textContent = text;
      d.style.left = `${x}px`;
      d.style.top = `${y}px`;
      grid.append(d);
    };
    const r2 = center(cellOf('R2'));
    dotAt(r2.x + 30, r2.y - 30, 'ok', '✓');
    // The vendor laptop's packet is stopped just before conduit 1: put the ✕ on its red path, not on the conduit.
    const v = center(cellOf('V')), c1 = center(conduit('1'));
    dotAt(v.x + (c1.x - v.x) * 0.5, v.y + (c1.y - v.y) * 0.5, 'bad', '✕');

    document.body.dataset.ready = 'true';
  </script>
</body>
</html>
